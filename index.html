:root{--bg:#e9eef1;--panel:#ffffff;--fg:#1d2a33;--muted:#5b6b75;--line:#c9d3d9;--accent:#1f6f8b}

#btn{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
button{background:var(--panel);color:var(--fg);border:1px solid var(--accent);border-radius:4px;padding:4px 10px;font:inherit;cursor:pointer}
